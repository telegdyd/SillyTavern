name: Build Claude-Adaptive Branch On-Demand

on:
  workflow_dispatch: # This creates the manual "Run workflow" button

env:
  REPO: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    # Notice I removed the 'if' statement here so it actually runs on your fork!

    steps:
      - name: Set lowercase repo name
        run: |
          echo "IMAGE_NAME=${REPO,,}" >> ${GITHUB_ENV}

      - name: Checkout the Claude Adaptive branch
        uses: actions/checkout@v4.1.2
        with:
          ref: "feat/claude-adaptive" # Hardcoded to your specific branch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for the image
        uses: docker/metadata-action@v5.5.1
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # This tags your image as 'claude-adaptive' so it's easy to find
          tags: |
            type=raw,value=claude-adaptive

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- NEW STEP WE ARE ADDING ---
      - name: Force npm install instead of npm ci
        run: sed -i 's/npm ci/npm install/g' Dockerfile
      # ------------------------------

      - name: Build and push
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
